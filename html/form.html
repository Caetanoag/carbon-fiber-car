<div class="form-div">
    <h2>Formulário de Conhecimentos</h2>
    <fieldset>
        <legend>
            <form action="index.html" class="form-box">
                <div id="form-section1" class="form-i-section">
                    <h3>Qual a classificação da fibra de carbono?</h3>
                    <div class="radio-selection">
                        <label for="tipo-base">Base</label>
                        <input type="radio" name="tipo-fibraC" id="tipo-base" />
                        <label for="tipo-acido">Acido</label>
                        <input
                            type="radio"
                            name="tipo-fibraC"
                            id="tipo-acido"
                        />
                        <label for="tipo-oxido">Oxido</label>
                        <input
                            type="radio"
                            name="tipo-fibraC"
                            id="tipo-oxido"
                        />
                        <label for="tipo-sal">Sal</label>
                        <input type="radio" name="tipo-fibraC" id="tipo-sal" />
                    </div>
                </div>
                <div id="form-section2" class="form-i-section">
                    <h3>
                        Qual elemento compõe a maior parte da fibra de carbono?
                    </h3>
                    <div class="radio-selection">
                        <label for="elemento-carbono">Carbono</label>
                        <input
                            type="radio"
                            name="elemento-fibraC"
                            id="elemento-carbono"
                        />

                        <label for="elemento-helio">Hélio</label>
                        <input
                            type="radio"
                            name="elemento-fibraC"
                            id="elemento-helio"
                        />

                        <label for="elemento-oxigenio">Oxigênio</label>
                        <input
                            type="radio"
                            name="elemento-fibraC"
                            id="elemento-oxigenio"
                        />
                    </div>
                </div>
            </form>
        </legend>
    </fieldset>
</div>
